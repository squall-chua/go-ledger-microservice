# A local development stack. Every default here is a development value, and
# none of them is fit to deploy:
#
#   - the JWT secret is the well-known one from the README, so anyone can mint
#     a token that this ledger will trust
#   - CORS allows any origin
#   - Postgres uses postgres/postgres and publishes port 5432 on the host
#
# Set LEDGER_JWT_SECRET and LEDGER_CORS_ORIGINS for anything reachable by
# someone else. See "Running the server" in README.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      # The ledger exits if it cannot reach Postgres at startup, so it has to
      # wait for a database that is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 12

  ledger:
    build: .
    command:
      - --port=8080
      - --database-url=postgres://postgres:postgres@postgres:5432/ledger?sslmode=disable
      - --jwt-secret=${LEDGER_JWT_SECRET:-super-secret-key}
      - --cors-origins=${LEDGER_CORS_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger-data:
