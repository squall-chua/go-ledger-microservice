syntax = "proto3";

package v1;

option go_package = "github.com/squall-chua/go-ledger-microservice/api/v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";
import "api/proto/v1/options.proto";

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ASSETS = 1;
  ACCOUNT_TYPE_LIABILITIES = 2;
  ACCOUNT_TYPE_EQUITIES = 3;
  ACCOUNT_TYPE_INCOMES = 4;
  ACCOUNT_TYPE_EXPENSES = 5;
}

// An Account is identified by the exact composite (type, user, name). There is
// no hierarchy, no wildcard and no roll-up: `name` is opaque and every field is
// matched exactly. See docs/adr/0002-flat-account-names.md.
message Account {
  AccountType type = 1;
  string user = 2; // Free-form owner label. Never an authenticated identity.
  string name = 3; // Opaque label, e.g. "Checking". Never split, never rolled up.
}

message Posting {
  string id = 1;
  string transaction_id = 2;
  Account account = 3;
  google.type.Money amount = 4;
  google.type.Money balance = 5; // Running balance of the Account after this leg.
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp date = 7; // Transaction date: supplied by the caller or stamped by the ledger.
}

message Transaction {
  string id = 1;
  string idempotency_key = 2;
  google.protobuf.Timestamp date = 3;
  string note = 4;
  map<string, string> metadata = 5;
  repeated Posting postings = 6;
  google.protobuf.Timestamp created_at = 7;
}

message RecordTransactionRequest {
  string idempotency_key = 1;
  google.protobuf.Timestamp date = 2;
  string note = 3;
  map<string, string> metadata = 4;

  message PostingInput {
    Account account = 1;
    google.type.Money amount = 2;
  }
  repeated PostingInput postings = 5;
  repeated Account verify_non_negative_balances = 6;
}

message RecordTransactionResponse {
  Transaction transaction = 1;
}

// An AccountFilter narrows a read to the Accounts whose fields match it
// exactly. A field it leaves unset is not filtered on at all; a field it sets
// to the empty string matches only the empty string, so an Account with no
// user can be asked for on its own. Nothing here is ever a wildcard.
message AccountFilter {
  AccountType type = 1; // Unspecified means "not filtered": no Account carries it.
  optional string user = 2;
  optional string name = 3;
}

// Every filter is optional; supplying none returns the Trial balance.
message ListAccountBalancesRequest {
  AccountFilter account = 1;
  string currency_code = 2;
}

message ListAccountBalancesResponse {
  repeated AccountBalance balances = 1;
}

message AccountBalance {
  Account account = 1;
  google.type.Money balance = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// Every filter is optional. The date range is half-open: start_date is
// included and end_date is excluded, so adjacent periods never double-count.
message TransactionFilter {
  string idempotency_key = 1; // Exact; matches at most one Transaction.
  google.protobuf.Timestamp start_date = 2; // Transaction date, inclusive.
  google.protobuf.Timestamp end_date = 3; // Transaction date, exclusive.
  // Exact metadata pairs the Transaction has to carry. Every pair given has
  // to match, key and value; a Transaction carrying more is still a match. An
  // empty key is refused.
  map<string, string> metadata = 4;
}

message ListTransactionsRequest {
  TransactionFilter filter = 1;
  int32 page_size = 2; // Defaults to 10, clamped to at most 100.
  int32 page_number = 3; // One-based; below one is the first page.
  bool order_by_ascending = 4; // Oldest Transaction date first. Default is newest first.
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int64 total_count = 2;
}

// A Register read: one Account's Postings over time. Every filter is optional
// and the date range is half-open, as on the Transaction listing.
message PostingFilter {
  AccountFilter account = 1;
  string currency_code = 2;
  google.protobuf.Timestamp start_date = 3; // Transaction date, inclusive.
  google.protobuf.Timestamp end_date = 4; // Transaction date, exclusive.
  // Matched against the parent Transaction's metadata — a Posting has none of
  // its own. Same exact-pair rule as on the Transaction listing.
  map<string, string> metadata = 5;
}

message ListPostingsRequest {
  PostingFilter filter = 1;
  int32 page_size = 2; // Defaults to 10, clamped to at most 100.
  int32 page_number = 3; // One-based; below one is the first page.
  bool order_by_ascending = 4; // Oldest Transaction date first. Default is newest first.
}

message ListPostingsResponse {
  repeated Posting postings = 1;
  int64 total_count = 2;
}

service LedgerService {
  rpc RecordTransaction(RecordTransactionRequest) returns (RecordTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/transactions"
      body: "*"
    };
    option (auth.v1.rule) = {
      required_scopes: ["ledger:write"]
    };
  }

  rpc ListAccountBalances(ListAccountBalancesRequest) returns (ListAccountBalancesResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/accounts/balance"
      body: "*"
    };
    option (auth.v1.rule) = {
      required_scopes: ["ledger:read"]
    };
  }

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/transactions/query"
      body: "*"
    };
    option (auth.v1.rule) = {
      required_scopes: ["ledger:read"]
    };
  }

  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse) {
    option (google.api.http) = {
      post: "/v1/ledger/postings/query"
      body: "*"
    };
    option (auth.v1.rule) = {
      required_scopes: ["ledger:read"]
    };
  }
}
